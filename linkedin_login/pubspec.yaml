name: linkedin_login
description: Library for login with LinkedIn OAuth V2 service with OpedID. This library helps you to implement authorization with LinkedIn OAuth API's.
version: 3.1.4
homepage: https://github.com/alikaradogan/linkedin_login
repository: https://github.com/alikaradogan/linkedin_login
documentation:
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=2.8.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0
  meta: ^1.16.0
  rxdart: ">=0.27.7 <0.29.0"
  uuid: ^4.5.1
  webview_flutter: ^4.13.0
  linkedin_login_platform_interface:
    git:
      url: https://github.com/alikaradogan/linkedin_login
      path: linkedin_login_platform_interface
  linkedin_login_ios:
    git:
      url: https://github.com/alikaradogan/linkedin_login
      path: linkedin_login_ios
  linkedin_login_android:
    git:
      url: https://github.com/alikaradogan/linkedin_login
      path: linkedin_login_android

dev_dependencies:
  flutter_test:
    sdk: flutter

  plugin_platform_interface: ^2.1.8
  build_runner: ^2.4.15
  mockito: ^5.4.6
  test: ^1.25.15
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        default_package: linkedin_login_android
      ios:
        default_package: linkedin_login_ios
  assets:
    - assets/linked_in_logo.png
